[mgr]
sort_by = "natural"
sort_dir_first = true
linemode = "permissions"
show_symlink = true

[preview]
tab_size = 4
image_delay = 100

[opener]
edit = [{ run = "nvim %s", block = true, desc = "Neovim" }]
open = [{ run = "xdg-open %s1", desc = "Open" }]

[open]
rules = [{ mime = "text/*", use = "edit" }]
append_rules = [{ url = "*", use = "open" }]
