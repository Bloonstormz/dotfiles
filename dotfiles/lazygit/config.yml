gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - '#a6e3a1'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#a6e3a1'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
    authorColors:
      '*': '#b4befe'
git:
  diffRenderers:
    - command: delta --paging=never --diff-args=word-diff=color --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - type: rawGit
  commit:
    signOff: true
  log:
    order: default
customCommands:
  - key: '<ctrl+shift+a>'
    context: 'commits'
    description: 'Amend without hooks'
    command: "set -e\nSTASH_ENTRY=false\nCOMMIT={{.SelectedCommit.Hash}}\nHEAD=\"$(git rev-parse HEAD)\"\n\nif [ \"$COMMIT\" = \"$HEAD\" ]; then \n  git commit --amend --no-verify --allow-empty --allow-empty-message --no-edit\nelse\n  if ! [ $(git status | grep \"working tree clean\") ]; then\n    git stash -k\n    STASH_ENTRY=true\n  fi\n\n  git commit --no-verify --squash \"$COMMIT\" --no-edit\n  GIT_EDITOR=':' git rebase -i --autosquash ${COMMIT}^\n\n  if [ $STASH_ENTRY = true ]; then\n    git stash pop\n  fi\nfi\n"
    output: 'terminal'
os:
  copyToClipboardCmd: printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty
